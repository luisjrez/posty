name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and test
        run: bun run check

  build-ios:
    name: Build iOS · ${{ vars.BUILD_RUNNER == 'eas' && 'EAS' || 'GitHub' }}
    needs: check
    runs-on: ${{ vars.BUILD_RUNNER == 'eas' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    outputs:
      build-id: ${{ steps.eas.outputs.build-id }}
      build-url: ${{ steps.eas.outputs.build-url || steps.local.outputs.build-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build on EAS
        id: eas
        if: vars.BUILD_RUNNER == 'eas'
        uses: ./.github/actions/eas-build
        with:
          platform: ios
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}

      # Same Xcode as the E2E job, so the app is built for the runtime it is tested on.
      - name: Select Xcode
        if: vars.BUILD_RUNNER != 'eas'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build on GitHub runner
        id: local
        if: vars.BUILD_RUNNER != 'eas'
        uses: ./.github/actions/local-build
        with:
          platform: ios
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}

  build-android:
    name: Build Android · ${{ vars.BUILD_RUNNER == 'eas' && 'EAS' || 'GitHub' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    outputs:
      build-id: ${{ steps.eas.outputs.build-id }}
      build-url: ${{ steps.eas.outputs.build-url || steps.local.outputs.build-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build on EAS
        id: eas
        if: vars.BUILD_RUNNER == 'eas'
        uses: ./.github/actions/eas-build
        with:
          platform: android
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}

      - name: Build on GitHub runner
        id: local
        if: vars.BUILD_RUNNER != 'eas'
        uses: ./.github/actions/local-build
        with:
          platform: android
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}

  e2e-ios:
    name: E2E iOS
    needs: build-ios
    permissions:
      contents: read
      pull-requests: write
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: 2.11.0
      # The XCTest driver can take minutes to start on a cold hosted macOS simulator.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      APP_ID: com.luisjuarez.posty.stage
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        id: build
        uses: ./.github/actions/download-build
        with:
          platform: ios
          build-id: ${{ needs.build-ios.outputs.build-id }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

      # Pin the Xcode (and so the simulator runtimes) instead of whatever the image defaults to.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator and install app
        run: |
          # An iPhone 17 Pro on the newest iOS runtime. Taking the first iPhone listed could land on
          # an older runtime whose first boot starved the Maestro driver (the setup Postify uses).
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))
            | last.value | (map(select(.name == "iPhone 17 Pro")) + .) | first.udid')
          echo "Booting $udid"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "${{ steps.build.outputs.path }}"
          # A freshly created simulator keeps doing first-boot work after bootstatus returns,
          # which starved the Maestro driver (startup timeouts, minute-long flows). Opening the
          # app once and letting it settle absorbs that before the flows start.
          xcrun simctl launch "$udid" "$APP_ID"
          sleep 45
          xcrun simctl terminate "$udid" "$APP_ID"

      - name: Run Maestro flows
        run: maestro test .maestro/ios -e APP_ID=$APP_ID --format junit --output build/maestro/report.xml --test-output-dir build/maestro

      - name: Upload Maestro results
        id: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: build/maestro
          if-no-files-found: ignore

      - name: Report flows with videos
        if: always() && hashFiles('build/maestro/report.xml') != ''
        uses: ./.github/actions/maestro-report
        with:
          platform: ios
          results-dir: build/maestro
          report: build/maestro/report.xml
          results-url: ${{ steps.results.outputs.artifact-url }}

  e2e-android:
    name: E2E Android
    needs: build-android
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: 2.11.0
      APP_ID: com.luisjuarez.posty.stage
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        id: build
        uses: ./.github/actions/download-build
        with:
          platform: android
          build-id: ${{ needs.build-android.outputs.build-id }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.build.outputs.path }}
        with:
          api-level: 35
          arch: x86_64
          # No Google Play services: on google_apis they update system modules in the background
          # minutes after boot, which restarted adb mid-run (device offline). The app needs none.
          target: default
          disable-animations: true
          # Each line runs as its own shell command, so keep them single-line.
          script: |
            adb wait-for-device
            adb install "$APK_PATH"
            maestro test .maestro/android -e APP_ID=$APP_ID --format junit --output build/maestro/report.xml --test-output-dir build/maestro

      - name: Upload Maestro results
        id: results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: build/maestro
          if-no-files-found: ignore

      - name: Report flows with videos
        if: always() && hashFiles('build/maestro/report.xml') != ''
        uses: ./.github/actions/maestro-report
        with:
          platform: android
          results-dir: build/maestro
          report: build/maestro/report.xml
          results-url: ${{ steps.results.outputs.artifact-url }}
