name: Local staging build
description: Repacks the staging app stored on EAS for this fingerprint, or builds it on the runner and stores it, then reports it on the pull request

inputs:
  platform:
    description: ios or android
    required: true
  design-system:
    description: Design system bundled into the app
    default: posty
  expo-token:
    required: true
  github-token:
    required: true

outputs:
  build-id:
    value: ${{ steps.store.outputs.build_id }}
  build-url:
    value: ${{ steps.store.outputs.build_url }}
  mode:
    value: ${{ steps.lookup.outputs.mode }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - name: Cache bun packages
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - shell: bash
      run: bun install --frozen-lockfile

    - name: Pull staging env
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: bun run env:use staging

    - name: Apply design system
      shell: bash
      run: bun run ds:apply --ds=${{ inputs.design-system }}

    - name: Fingerprint
      id: fingerprint
      shell: bash
      run: echo "hash=$(bunx fingerprint fingerprint:generate --platform ${{ inputs.platform }} | jq -r .hash)" >> "$GITHUB_OUTPUT"

    - name: Look up build on EAS
      id: lookup
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        url=$(bunx eas-cli build:list \
          --platform ${{ inputs.platform }} \
          --status finished \
          --fingerprint-hash ${{ steps.fingerprint.outputs.hash }} \
          --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl // empty')
        echo "source_url=$url" >> "$GITHUB_OUTPUT"
        echo "mode=$([ -n "$url" ] && echo repack || echo build)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@v6
      if: inputs.platform == 'android' && steps.lookup.outputs.mode == 'build'
      with:
        distribution: temurin
        java-version: '17'

    - uses: gradle/actions/setup-gradle@v6
      if: inputs.platform == 'android' && steps.lookup.outputs.mode == 'build'

    - name: Repack
      if: steps.lookup.outputs.mode == 'repack'
      shell: bash
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      run: |
        mkdir -p .build
        if [ "${{ inputs.platform }}" = ios ]; then
          curl -fsSL -o .build/source.tar.gz "${{ steps.lookup.outputs.source_url }}"
          mkdir -p .build/source && tar -xzf .build/source.tar.gz -C .build/source
          bunx @expo/repack-app --platform ios --source-app .build/source/*.app --output .build/app/PostyStage.app .
          tar -czf .build/app.tar.gz -C .build/app PostyStage.app
          echo "ARTIFACT=.build/app.tar.gz" >> "$GITHUB_ENV"
        else
          curl -fsSL -o .build/source.apk "${{ steps.lookup.outputs.source_url }}"
          bunx @expo/repack-app --platform android --source-app .build/source.apk --output .build/app.apk .
          echo "ARTIFACT=.build/app.apk" >> "$GITHUB_ENV"
        fi

    - name: Build
      if: steps.lookup.outputs.mode == 'build'
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        DESIGN_SYSTEM: ${{ inputs.design-system }}
      run: |
        mkdir -p .build
        ext=$([ "${{ inputs.platform }}" = ios ] && echo tar.gz || echo apk)
        bunx eas-cli build --local --platform ${{ inputs.platform }} --profile staging --non-interactive --output ".build/app.$ext"
        echo "ARTIFACT=.build/app.$ext" >> "$GITHUB_ENV"

    - name: Store on EAS
      id: store
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        build_url=$(bunx eas-cli upload --platform ${{ inputs.platform }} --build-path "$ARTIFACT" --fingerprint ${{ steps.fingerprint.outputs.hash }} --json | jq -r .url)
        echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
        echo "build_id=${build_url##*/}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v7
      with:
        name: staging-${{ inputs.platform }}
        path: ${{ env.ARTIFACT }}
        retention-days: 7

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MARKER: <!-- eas-build-${{ inputs.platform }} -->
        BODY: |
          <!-- eas-build-${{ inputs.platform }} -->
          ### Staging build · ${{ inputs.platform }} · `${{ github.event.pull_request.head.sha }}`

          | Runner | Mode | Fingerprint | Artifact |
          | --- | --- | --- | --- |
          | GitHub | ${{ steps.lookup.outputs.mode }} | `${{ steps.fingerprint.outputs.hash }}` | ${{ steps.store.outputs.build_url }} |
      run: |
        endpoint="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
        comment_id=$(gh api "$endpoint" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$BODY" > /dev/null
        else
          gh api -X POST "$endpoint" -f body="$BODY" > /dev/null
        fi
