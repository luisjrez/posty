appId: ${APP_ID}
name: Favorite toggle · save a Post from its card
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- extendedWaitUntil:
    visible: 'sunt aut facere.*'
    timeout: 30000
- assertVisible:
    id: 'favorite-toggle-1'
    selected: false
- tapOn:
    id: 'favorite-toggle-1'
- assertVisible:
    id: 'favorite-toggle-1'
    selected: true
- takeScreenshot: favorite-toggle
# Relaunching without clearing state proves the Favorite was persisted, not just toggled.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'favorite-toggle-1'
      selected: true
    timeout: 30000
- stopRecording
