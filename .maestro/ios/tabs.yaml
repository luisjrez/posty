appId: ${APP_ID}
name: Tabs · switch between Posts and Favorites
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- extendedWaitUntil:
    visible: 'sunt aut facere.*'
    timeout: 30000
- tapOn: 'Favorites'
- assertVisible: 'No favorites yet'
- takeScreenshot: favorites-tab
- tapOn: 'Posts'
- assertVisible: 'sunt aut facere.*'
- stopRecording
