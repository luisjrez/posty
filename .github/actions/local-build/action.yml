name: Local staging build
description: Repacks the staging app stored on EAS for this fingerprint, or builds it on the runner and stores it, then reports it on the pull request

inputs:
  platform:
    description: ios or android
    required: true
  design-system:
    description: Design system bundled into the app
    default: posty
  expo-token:
    required: true
  github-token:
    required: true

outputs:
  build-id:
    value: ${{ steps.store.outputs.build_id }}
  build-url:
    value: ${{ steps.store.outputs.build_url || steps.artifact.outputs.artifact-url }}
  mode:
    value: ${{ steps.lookup.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Cache bun packages
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Pull staging env
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: bun run env:use staging

    - name: Apply design system
      shell: bash
      run: bun run ds:apply --ds=${{ inputs.design-system }}

    - name: Fingerprint
      id: fingerprint
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        result=$(bunx eas-cli fingerprint:generate --platform ${{ inputs.platform }} --build-profile staging --json --non-interactive)
        if ! jq -e 'any(.sources[]; .id == "expoConfig")' <<<"$result" > /dev/null; then
          echo "::error::The fingerprint left out the app config, so it cannot be trusted"
          exit 1
        fi
        echo "hash=$(jq -r .hash <<<"$result")" >> "$GITHUB_OUTPUT"

    - name: Download build for this fingerprint
      id: lookup
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        if source=$(bunx eas-cli build:download --fingerprint ${{ steps.fingerprint.outputs.hash }} --platform ${{ inputs.platform }} --json | jq -er .path); then
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "mode=repack" >> "$GITHUB_OUTPUT"
        else
          echo "mode=build" >> "$GITHUB_OUTPUT"
        fi

    - name: Free disk space
      if: inputs.platform == 'android' && steps.lookup.outputs.mode == 'build'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL

    - name: Set up Java
      if: inputs.platform == 'android' && steps.lookup.outputs.mode == 'build'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      if: inputs.platform == 'android' && steps.lookup.outputs.mode == 'build'
      uses: gradle/actions/setup-gradle@v6

    - name: Repack with this commit's JavaScript
      if: steps.lookup.outputs.mode == 'repack'
      shell: bash
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      run: |
        mkdir -p .build
        if [ "${{ inputs.platform }}" = ios ]; then
          bunx @expo/repack-app --platform ios --source-app "${{ steps.lookup.outputs.source }}" --output .build/PostyStage.app .
          tar -czf .build/app.tar.gz -C .build PostyStage.app
          echo "ARTIFACT=.build/app.tar.gz" >> "$GITHUB_ENV"
        else
          bunx @expo/repack-app --platform android --source-app "${{ steps.lookup.outputs.source }}" --output .build/app.apk .
          echo "ARTIFACT=.build/app.apk" >> "$GITHUB_ENV"
        fi

    - name: Build native app
      if: steps.lookup.outputs.mode == 'build'
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        DESIGN_SYSTEM: ${{ inputs.design-system }}
        ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64,arm64-v8a
      run: |
        mkdir -p .build
        ext=$([ "${{ inputs.platform }}" = ios ] && echo tar.gz || echo apk)
        bunx eas-cli build --local --platform ${{ inputs.platform }} --profile staging --non-interactive --output ".build/app.$ext"
        echo "ARTIFACT=.build/app.$ext" >> "$GITHUB_ENV"

    - name: Store native app on EAS
      id: store
      if: steps.lookup.outputs.mode == 'build'
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
      run: |
        build_url=$(bunx eas-cli upload --platform ${{ inputs.platform }} --build-path "$ARTIFACT" --fingerprint ${{ steps.fingerprint.outputs.hash }} --json | jq -r .url)
        echo "build_url=$build_url" >> "$GITHUB_OUTPUT"
        echo "build_id=${build_url##*/}" >> "$GITHUB_OUTPUT"

    - name: Upload app artifact
      id: artifact
      uses: actions/upload-artifact@v7
      with:
        name: staging-${{ inputs.platform }}
        path: ${{ env.ARTIFACT }}
        retention-days: 7

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MARKER: <!-- eas-build-${{ inputs.platform }} -->
        BODY: |
          <!-- eas-build-${{ inputs.platform }} -->
          ### Staging build · ${{ inputs.platform }} · `${{ github.event.pull_request.head.sha }}`

          | Runner | Mode | Fingerprint | Artifact |
          | --- | --- | --- | --- |
          | GitHub | ${{ steps.lookup.outputs.mode }} | `${{ steps.fingerprint.outputs.hash }}` | ${{ steps.store.outputs.build_url || steps.artifact.outputs.artifact-url }} |
      run: |
        endpoint="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
        comment_id=$(gh api "$endpoint" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$BODY" > /dev/null
        else
          gh api -X POST "$endpoint" -f body="$BODY" > /dev/null
        fi
