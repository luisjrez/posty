appId: ${APP_ID}
name: Posts list · scroll paginates and search narrows results
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- assertVisible: 'sunt aut facere.*'
# Post 21 is the first one of page 2, so seeing it proves the next page was fetched.
- scrollUntilVisible:
    element: 'asperiores ea ipsam voluptatibus.*'
    direction: DOWN
    # FlashList reports cards partly clipped by the tab bar; half visible is enough here.
    visibilityPercentage: 50
- takeScreenshot: posts-page-2
# Android keeps the search action in the toolbar while scrolling, so no relaunch is needed.
- tapOn: 'Search'
- inputText: 'dolorem eum'
# The match is already on the unfiltered list, so wait for a non-match to go: that is the
# filtered response landing, not the old list.
- extendedWaitUntil:
    notVisible: 'asperiores ea ipsam voluptatibus.*'
    timeout: 15000
- assertVisible: 'dolorem eum magni eos aperiam quia'
- takeScreenshot: posts-search
- stopRecording
