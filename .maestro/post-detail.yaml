name: Post detail · tapping a Post opens it with its Comments
appId: ${APP_ID}
env:
  # Each variant has its own scheme; CI runs the staging build.
  SCHEME: posty-stage
# Each flow records its own video (the CI report links one per flow); onFlowComplete stops it
# whether the flow passed or failed.
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
---
- runFlow: launch/release.yaml
- tapOn:
    id: 'post-1'
# The first Comment of Post 1 proves the detail loaded its Comments from the server.
- extendedWaitUntil:
    visible:
      id: 'comment-1'
    timeout: 10000
- assertVisible:
    id: 'post-detail-1'
# jsonplaceholder has five Comments per Post; the last one is below the fold on small screens.
- scrollUntilVisible:
    element:
      id: 'comment-5'
    direction: DOWN
    speed: 60
    timeout: 15000
- takeScreenshot: post-detail
