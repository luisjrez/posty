appId: ${APP_ID}
name: Deep links · cold and warm start open the right tab and Post
env:
  # Each variant has its own scheme; CI runs the staging build.
  SCHEME: posty-stage
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- assertVisible: 'sunt aut facere.*'
# Cold start: the app is closed when the link arrives.
- stopApp
- openLink: ${SCHEME}://posts/6
- assertVisible: 'in deleniti sunt provident soluta ratione veniam quam praesentium'
- takeScreenshot: deep-link-cold
# Back lands on the Posts list kept underneath, instead of leaving the app.
- back
- assertVisible: 'sunt aut facere.*'
# Warm start: the app is open when a Favorites link arrives.
- openLink: ${SCHEME}://favorites/posts/6
- assertVisible: 'in deleniti sunt provident soluta ratione veniam quam praesentium'
- back
- assertVisible: 'No favorites yet'
- openLink: ${SCHEME}://posts/abc
- assertVisible: 'Post not found'
- openLink: ${SCHEME}://favorites
- assertVisible: 'No favorites yet'
- stopRecording
