name: Favorite toggle · a Post saved from its card stays saved after a restart
appId: ${APP_ID}
env:
  # Each variant has its own scheme; CI runs the staging build.
  SCHEME: posty-stage
# Each flow records its own video (the CI report links one per flow); onFlowComplete stops it
# whether the flow passed or failed.
onFlowStart:
  - startRecording: ${MAESTRO_FILENAME}
onFlowComplete:
  - stopRecording
---
- runFlow: launch/release.yaml
- assertVisible:
    id: 'post-1-favorite'
    selected: false
- tapOn:
    id: 'post-1-favorite'
- assertVisible:
    id: 'post-1-favorite'
    selected: true
- takeScreenshot: favorite-toggle
- runFlow: launch/relaunch.yaml
- assertVisible:
    id: 'post-1-favorite'
    selected: true
