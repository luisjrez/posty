appId: ${APP_ID}
name: Posts list · search narrows results and scroll paginates
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- assertVisible: 'sunt aut facere.*'
# Search first: the header search bar is only visible while the list is at the top. iOS may
# start with it tucked under the large title; scrolling up reveals it, retrying until it shows.
- scrollUntilVisible:
    element: 'Search posts'
    direction: UP
- tapOn: 'Search posts'
- inputText: 'dolorem eum'
# The match is already on the unfiltered list, so wait for a non-match to go: that is the
# filtered response landing, not the old list.
- extendedWaitUntil:
    notVisible: 'sunt aut facere.*'
    timeout: 15000
- assertVisible: 'dolorem eum magni eos aperiam quia'
- takeScreenshot: posts-search
# Cancelling restores the full list; reaching Post 21 (filtered out by the search and the
# first one of page 2) proves both the restore and that the next page was fetched.
# iOS 26 labels the search bar's cancel button "Close"; earlier versions say "Cancel".
- tapOn: 'Cancel|Close'
- scrollUntilVisible:
    element: 'asperiores ea ipsam voluptatibus.*'
    direction: DOWN
    # FlashList reports cards partly clipped by the tab bar; half visible is enough here.
    visibilityPercentage: 50
- takeScreenshot: posts-page-2
- stopRecording
