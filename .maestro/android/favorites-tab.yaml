appId: ${APP_ID}
name: Favorites tab · a saved Post appears there and can be removed
---
- launchApp:
    clearState: true
- startRecording: ${MAESTRO_FILENAME}
- assertVisible: 'sunt aut facere.*'
- tapOn:
    id: 'favorite-toggle-2'
- tapOn: 'Favorites'
- assertVisible: 'qui est esse'
- takeScreenshot: favorites-tab
# Its heart removes it, leaving the empty state that explains how to save.
- tapOn:
    id: 'favorite-toggle-2'
- assertVisible: 'Tap the heart on a post to save it here.'
- stopRecording
