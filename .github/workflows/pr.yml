name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run check

  build-ios:
    name: Build iOS · EAS
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    outputs:
      build-id: ${{ steps.eas.outputs.build-id }}
      build-url: ${{ steps.eas.outputs.build-url }}
    steps:
      - uses: actions/checkout@v7
      - id: eas
        uses: ./.github/actions/eas-build
        with:
          platform: ios
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}

  build-android:
    name: Build Android · EAS
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    outputs:
      build-id: ${{ steps.eas.outputs.build-id }}
      build-url: ${{ steps.eas.outputs.build-url }}
    steps:
      - uses: actions/checkout@v7
      - id: eas
        uses: ./.github/actions/eas-build
        with:
          platform: android
          expo-token: ${{ secrets.EXPO_TOKEN }}
          github-token: ${{ github.token }}
